<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Defender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #c8dcff;
    touch-action: none;
  }
  h1 {
    margin-bottom: 6px;
    font-size: 24px;
    letter-spacing: 2px;
    color: #e0eeff;
  }
  #tagline {
    margin-bottom: 12px;
    font-size: 12px;
    color: #6f84a5;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #8aa0c0;
  }
  #hud strong { color: #e0eeff; }
  #gc {
    border: 1px solid #1a3050;
    border-radius: 8px;
    display: block;
    background: #050a14;
  }
  #msg {
    margin-top: 10px;
    font-size: 12px;
    color: #5a7090;
    text-align: center;
  }
  #touch-controls {
    display: none;
    gap: 10px;
    margin-top: 12px;
    user-select: none;
  }
  #touch-controls button {
    background: #08162a;
    color: #c8dcff;
    border: 1px solid #1a3050;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: monospace;
  }
  @media (max-width: 600px) {
    #hud, #gc { width: 94vw; }
    #gc { height: calc(94vw * 1.1667); }
    #touch-controls { display: flex; flex-wrap: wrap; justify-content: center; max-width: 360px; }
  }
</style>
</head>
<body>

<h1>SPACE DEFENDER</h1>
<div id="tagline">Defend your sector through 10 waves.</div>

<div id="hud">
  <span>Score: <strong id="score-display">0</strong></span>
  <span id="level-display">Wave 1</span>
  <span>Lives: <strong id="lives-display">3</strong></span>
  <span>Retries: <strong id="retries-display">3</strong></span>
</div>
<canvas id="gc" width="480" height="560"></canvas>
<div id="msg">Arrow keys / WASD to move &nbsp;|&nbsp; Space to shoot &nbsp;|&nbsp; Press Space to start</div>
<div id="touch-controls" aria-label="Touch controls">
  <button data-key="ArrowLeft">Left</button>
  <button data-key="ArrowUp">Up</button>
  <button data-key="ArrowDown">Down</button>
  <button data-key="ArrowRight">Right</button>
  <button data-key=" ">Shoot / Start</button>
</div>

<script>
const C = document.getElementById('gc');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;
const MAX_WAVES = 10;
const MAX_RETRIES = 3;

// Per-wave config: cols, rows, speed, enemyFireRate, bossHP (0=no boss)
const WAVE_CONFIG = [
  { cols:6,  rows:2, speed:0.6,  fireRate:55, bossHP:0  }, // wave 1
  { cols:7,  rows:2, speed:0.8,  fireRate:50, bossHP:0  }, // wave 2
  { cols:7,  rows:3, speed:1.0,  fireRate:45, bossHP:0  }, // wave 3
  { cols:8,  rows:3, speed:1.2,  fireRate:40, bossHP:0  }, // wave 4
  { cols:8,  rows:3, speed:1.4,  fireRate:35, bossHP:50 }, // wave 5 – boss
  { cols:8,  rows:4, speed:1.5,  fireRate:32, bossHP:0  }, // wave 6
  { cols:9,  rows:4, speed:1.7,  fireRate:28, bossHP:0  }, // wave 7
  { cols:9,  rows:4, speed:1.9,  fireRate:24, bossHP:0  }, // wave 8
  { cols:10, rows:4, speed:2.1,  fireRate:20, bossHP:0  }, // wave 9
  { cols:10, rows:5, speed:2.3,  fireRate:16, bossHP:100 }, // wave 10 – final boss
];

let state = 'idle', score = 0, lives = 3, wave = 1, retriesLeft = MAX_RETRIES;
let ship, bullets, enemies, particles, powerups, stars, boss;
let keys = {}, frame = 0, raf;
let shootCooldown = 0, enemyShootCooldown = 0, enemyBullets = [];
let shieldTimer = 0, rapidTimer = 0, spreadTimer = 0;
let waveTransition = false;

function initStars() {
  stars = Array.from({ length: 100 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3, s: Math.random() * 0.6 + 0.2
  }));
}

function initGame() {
  score = 0; lives = 3; wave = 1; retriesLeft = MAX_RETRIES; frame = 0;
  ship = { x: W / 2, y: H - 70, w: 28, h: 28, speed: 4 };
  bullets = []; enemies = []; particles = []; powerups = []; enemyBullets = [];
  boss = null; waveTransition = false;
  shootCooldown = 0; shieldTimer = 0; rapidTimer = 0; spreadTimer = 0;
  initStars(); spawnWave();
}

function cfg() { return WAVE_CONFIG[Math.min(wave - 1, MAX_WAVES - 1)]; }

function triggerDefeat() {
  if (state !== 'play') return;
  if (retriesLeft > 0) {
    retriesLeft--;
    state = 'retry';
  } else {
    state = 'gameover';
  }
}

function useRetry() {
  lives = 3;
  ship = { x: W / 2, y: H - 70, w: 28, h: 28, speed: 4 };
  bullets = [];
  enemyBullets = [];
  particles = [];
  powerups = [];
  shootCooldown = 0;
  shieldTimer = 0;
  rapidTimer = 0;
  spreadTimer = 0;
  waveTransition = false;
  spawnWave();
  state = 'play';
}

function spawnWave() {
  waveTransition = false;
  enemies = []; bullets = []; enemyBullets = []; boss = null;
  const c = cfg();
  // Boss waves
  if (c.bossHP > 0) {
    boss = {
      x: W / 2, y: 90, w: 64, h: 40,
      hp: c.bossHP, maxHp: c.bossHP,
      dir: 1, speed: 1.5 + wave * 0.1,
      shootTimer: 0, phase: 1,
      alive: true
    };
    return;
  }
  // Normal waves
  const gap = Math.floor((W - 80) / c.cols);
  for (let r = 0; r < c.rows; r++) {
    for (let col = 0; col < c.cols; col++) {
      let type = 'basic';
      if (r === 0 && wave >= 4) type = 'elite';
      else if (r <= 1 && wave >= 2) type = 'fast';
      enemies.push({
        x: 40 + col * gap, y: 44 + r * 46,
        w: 24, h: 18, alive: true, type,
        speed: c.speed, dir: 1,
        hp: type === 'elite' ? (wave >= 8 ? 3 : 2) : 1
      });
    }
  }
}

function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 35, color });
}

function trySpawnPowerup(x, y) {
  if (Math.random() < 0.20) {
    const types = ['shield','rapid','spread'];
    powerups.push({ x, y, vy: 1.2, type: types[Math.floor(Math.random()*types.length)], life: 320 });
  }
}

// ── Drawing helpers ──────────────────────────────────────────

function drawStars() {
  stars.forEach(s => {
    s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    ctx.fillStyle = `rgba(200,220,255,${0.3+s.r*0.2})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
}

function drawShip(x, y, shield) {
  ctx.save(); ctx.translate(x, y);
  if (shield) {
    ctx.strokeStyle = 'rgba(80,200,255,0.55)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle = '#4ab5f5';
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(12,12); ctx.lineTo(0,6); ctx.lineTo(-12,12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a6fa8';
  ctx.beginPath(); ctx.moveTo(-6,8); ctx.lineTo(-14,16); ctx.lineTo(-8,8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6,8); ctx.lineTo(14,16); ctx.lineTo(8,8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(80,200,255,0.85)';
  ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(5,14); ctx.lineTo(-5,14); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.type==='elite' ? '#e06060' : e.type==='fast' ? '#d4a030' : '#7c60d4';
  ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(-12,-8); ctx.lineTo(0,-4); ctx.lineTo(12,-8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(0,-2,4,3,0,0,Math.PI*2); ctx.fill();
  // HP pips for elite
  if (e.type==='elite' && e.hp > 1) {
    ctx.fillStyle = '#ff4040';
    for (let i=0;i<e.hp-1;i++) { ctx.beginPath(); ctx.arc(-4+i*8, 14, 2, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.restore();
}

function drawBoss(b) {
  if (!b.alive) return;
  ctx.save(); ctx.translate(b.x, b.y);
  // Body
  ctx.fillStyle = wave >= 10 ? '#cc2020' : '#882060';
  ctx.beginPath();
  ctx.moveTo(0,-28); ctx.lineTo(38,0); ctx.lineTo(28,28); ctx.lineTo(-28,28); ctx.lineTo(-38,0); ctx.closePath(); ctx.fill();
  // Cockpit
  ctx.fillStyle = 'rgba(255,200,80,0.6)';
  ctx.beginPath(); ctx.ellipse(0, 4, 14, 10, 0, 0, Math.PI*2); ctx.fill();
  // Wings
  ctx.fillStyle = wave>=10 ? '#991010' : '#601040';
  ctx.beginPath(); ctx.moveTo(28,10); ctx.lineTo(56,30); ctx.lineTo(28,28); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-28,10); ctx.lineTo(-56,30); ctx.lineTo(-28,28); ctx.closePath(); ctx.fill();
  ctx.restore();
  // HP bar
  const barW = 160, barX = W/2-barW/2, barY = 14;
  ctx.fillStyle = '#1a1a2a'; ctx.fillRect(barX, barY, barW, 10);
  const pct = b.hp / b.maxHp;
  ctx.fillStyle = pct > 0.5 ? '#40e080' : pct > 0.25 ? '#e0a020' : '#e04040';
  ctx.fillRect(barX, barY, barW * pct, 10);
  ctx.strokeStyle = '#304060'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, 10);
  ctx.fillStyle = '#c0d8ff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`BOSS  ${b.hp} / ${b.maxHp}`, W/2, barY + 9);
}

function drawBullet(b, enemy = false) {
  ctx.save();
  ctx.shadowBlur = 6; ctx.shadowColor = enemy ? '#ff6060' : '#60e0ff';
  ctx.fillStyle = enemy ? '#ff6060' : '#60e0ff';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(b.x-2, b.y-6, 4, 12, 2);
  else ctx.rect(b.x-2, b.y-6, 4, 12);
  ctx.fill();
  ctx.restore();
}

function drawPowerup(p) {
  const cols = { shield:'#60cfff', rapid:'#ffd060', spread:'#a0f080' };
  const lbl  = { shield:'S', rapid:'R', spread:'X' };
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = cols[p.type]; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle='#fff';
  ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lbl[p.type],0,0); ctx.restore();
}

function drawHUD() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('lives-display').textContent = lives;
  document.getElementById('retries-display').textContent = retriesLeft;
  document.getElementById('level-display').textContent = 'Wave ' + wave + ' / ' + MAX_WAVES;
  if (rapidTimer > 0 || shieldTimer > 0 || spreadTimer > 0) {
    ctx.font = '11px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,240,160,0.9)';
    let txt = '';
    if (shieldTimer > 0) txt += '[SHIELD] ';
    if (rapidTimer > 0) txt += '[RAPID] ';
    if (spreadTimer > 0) txt += '[SPREAD] ';
    ctx.fillText(txt, 8, H - 8);
  }
}

// ── Boss AI ──────────────────────────────────────────────────

function updateBoss() {
  if (!boss || !boss.alive) return;
  boss.x += boss.speed * boss.dir;
  if (boss.x > W - 60 || boss.x < 60) boss.dir *= -1;

  // Phase 2 at half HP
  if (boss.hp <= boss.maxHp / 2) boss.phase = 2;

  boss.shootTimer++;
  const rate = boss.phase === 2 ? 18 : 30;
  if (boss.shootTimer >= rate) {
    boss.shootTimer = 0;
    // Straight down
    enemyBullets.push({ x: boss.x, y: boss.y + 32, vy: 4 + wave * 0.3 });
    if (boss.phase === 2) {
      // Spread
      enemyBullets.push({ x: boss.x, y: boss.y+32, vy: 3.5, vx: -2.5 });
      enemyBullets.push({ x: boss.x, y: boss.y+32, vy: 3.5, vx:  2.5 });
    }
    if (wave >= 10 && boss.phase === 2) {
      // Extra diagonal shots on final boss
      enemyBullets.push({ x: boss.x, y: boss.y+32, vy: 3, vx: -4 });
      enemyBullets.push({ x: boss.x, y: boss.y+32, vy: 3, vx:  4 });
    }
  }

  // Bullet-boss collision
  bullets.forEach((b, bi) => {
    if (!boss.alive) return;
    if (Math.abs(b.x - boss.x) < 42 && Math.abs(b.y - boss.y) < 32) {
      boss.hp -= 1;
      bullets.splice(bi, 1);
      spawnParticles(b.x, b.y, '#ffaa40', 4);
      if (boss.hp <= 0) {
        boss.alive = false;
        score += wave >= 10 ? 500 : 200;
        spawnParticles(boss.x, boss.y, '#ff8040', 30);
        trySpawnPowerup(boss.x, boss.y);
      }
    }
  });

  // Boss-ship collision
  if (Math.abs(boss.x - ship.x) < 50 && Math.abs(boss.y - ship.y) < 40) {
    if (shieldTimer <= 0) { lives--; if (lives <= 0) triggerDefeat(); }
    else shieldTimer = 0;
  }
}

// ── Main loop ────────────────────────────────────────────────

function loop() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#050a14'; ctx.fillRect(0,0,W,H);
  drawStars();

  if (state === 'idle' || state === 'retry' || state === 'gameover' || state === 'win') {
    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = 'rgba(74,181,245,0.9)'; ctx.font = 'bold 28px monospace';
      ctx.fillText('SPACE DEFENDER', W/2, H/2-50);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('10 waves of escalating chaos', W/2, H/2-14);
      ctx.fillText('Press SPACE to launch', W/2, H/2+18);
    } else if (state === 'retry') {
      ctx.fillStyle = 'rgba(255,210,80,0.95)'; ctx.font = 'bold 26px monospace';
      ctx.fillText('RETRY AVAILABLE', W/2, H/2-50);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('Retries left: ' + retriesLeft + ' / ' + MAX_RETRIES, W/2, H/2-18);
      ctx.fillText('Wave ' + wave + ' / ' + MAX_WAVES, W/2, H/2+10);
      ctx.fillText('Press SPACE to retry this wave', W/2, H/2+38);
    } else if (state === 'gameover') {
      ctx.fillStyle = 'rgba(240,100,100,0.95)'; ctx.font = 'bold 26px monospace';
      ctx.fillText('GAME OVER', W/2, H/2-50);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('No retries left', W/2, H/2-18);
      ctx.fillText('Final Score: ' + score, W/2, H/2+10);
      ctx.fillText('Press SPACE to restart', W/2, H/2+38);
    } else {
      ctx.fillStyle = 'rgba(100,240,160,0.95)'; ctx.font = 'bold 26px monospace';
      ctx.fillText('SECTOR CLEARED!', W/2, H/2-50);
      ctx.fillStyle = 'rgba(255,220,80,0.9)'; ctx.font = '14px monospace';
      ctx.fillText('All 10 waves defeated!', W/2, H/2-14);
      ctx.fillStyle = 'rgba(200,220,255,0.7)';
      ctx.fillText('Final Score: ' + score, W/2, H/2+14);
      ctx.fillText('Press SPACE to play again', W/2, H/2+42);
    }
    raf = requestAnimationFrame(loop); return;
  }

  frame++;

  // Ship movement
  if ((keys['ArrowLeft']||keys['a']) && ship.x > ship.w/2+4) ship.x -= ship.speed;
  if ((keys['ArrowRight']||keys['d']) && ship.x < W-ship.w/2-4) ship.x += ship.speed;
  if ((keys['ArrowUp']||keys['w']) && ship.y > H/2) ship.y -= ship.speed;
  if ((keys['ArrowDown']||keys['s']) && ship.y < H-ship.h/2-4) ship.y += ship.speed;

  // Player shoot
  if (shootCooldown > 0) shootCooldown--;
  if (keys[' '] && shootCooldown === 0) {
    shootCooldown = rapidTimer > 0 ? 5 : 13;
    bullets.push({ x: ship.x, y: ship.y-18, vy: -9 });
    if (spreadTimer > 0) {
      bullets.push({ x: ship.x, y: ship.y-14, vy: -8, vx: -2.5 });
      bullets.push({ x: ship.x, y: ship.y-14, vy: -8, vx:  2.5 });
    }
  }

  // Enemy grid movement
  let hitEdge = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.speed * e.dir * (e.type==='fast' ? 1.6 : 1);
    if (e.x > W-28 || e.x < 28) hitEdge = true;
  });
  if (hitEdge) enemies.forEach(e => { if (e.alive) { e.dir *= -1; e.y += 20; } });

  // Enemy shooting
  if (enemyShootCooldown > 0) enemyShootCooldown--;
  else {
    const alive = enemies.filter(e => e.alive);
    if (alive.length > 0) {
      const shooter = alive[Math.floor(Math.random()*alive.length)];
      const speed = 3 + wave * 0.35;
      enemyBullets.push({ x: shooter.x, y: shooter.y+12, vy: speed });
      // Wave 7+: occasional spread from enemies
      if (wave >= 7 && Math.random() < 0.3) {
        enemyBullets.push({ x: shooter.x, y: shooter.y+12, vy: speed*0.8, vx: -2 });
        enemyBullets.push({ x: shooter.x, y: shooter.y+12, vy: speed*0.8, vx:  2 });
      }
      enemyShootCooldown = cfg().fireRate;
    }
  }

  // Move bullets
  bullets = bullets.filter(b => { b.x += b.vx||0; b.y += b.vy; return b.y > -10 && b.x > -10 && b.x < W+10; });
  enemyBullets = enemyBullets.filter(b => { b.x += b.vx||0; b.y += b.vy; return b.y < H+10 && b.x > -20 && b.x < W+20; });

  // Boss update
  updateBoss();

  // Bullet-enemy collisions
  bullets.forEach((b, bi) => {
    enemies.forEach(e => {
      if (!e.alive) return;
      if (Math.abs(b.x-e.x) < 14 && Math.abs(b.y-e.y) < 12) {
        e.hp--; bullets.splice(bi,1);
        if (e.hp <= 0) {
          e.alive = false;
          score += e.type==='elite' ? 30 : e.type==='fast' ? 20 : 10;
          spawnParticles(e.x, e.y, e.type==='elite'?'#ff8080':e.type==='fast'?'#ffd080':'#a080ff');
          trySpawnPowerup(e.x, e.y);
        }
      }
    });
  });

  // Enemy-ship collisions
  const hasShield = shieldTimer > 0;
  enemies.forEach(e => {
    if (!e.alive) return;
    if (Math.abs(e.x-ship.x) < 22 && Math.abs(e.y-ship.y) < 22) {
      if (!hasShield) { lives--; spawnParticles(ship.x, ship.y, '#4ab5f5', 12); }
      e.alive = false; if (lives <= 0) { triggerDefeat(); return; }
    }
    if (e.y > H) { lives--; e.alive=false; if (lives<=0) triggerDefeat(); }
  });

  // Enemy bullet-ship collisions
  enemyBullets = enemyBullets.filter(b => {
    if (Math.abs(b.x-ship.x) < 14 && Math.abs(b.y-ship.y) < 14) {
      if (!hasShield) { lives--; spawnParticles(ship.x,ship.y,'#ff8080',8); }
      else shieldTimer = Math.max(0, shieldTimer-30);
      if (lives <= 0) triggerDefeat();
      return false;
    }
    return true;
  });

  // Powerups
  powerups = powerups.filter(p => {
    p.y += p.vy; p.life--;
    if (Math.abs(p.x-ship.x)<18 && Math.abs(p.y-ship.y)<18) {
      if (p.type==='shield') shieldTimer=360;
      else if (p.type==='rapid') rapidTimer=360;
      else if (p.type==='spread') spreadTimer=360;
      return false;
    }
    return p.life>0 && p.y<H+20;
  });
  if (rapidTimer>0) rapidTimer--;
  if (shieldTimer>0) shieldTimer--;
  if (spreadTimer>0) spreadTimer--;

  // Particles
  particles = particles.filter(p => {
    p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.94; p.vy*=0.94; return p.life>0;
  });

  // Wave clear check
  const bossCleared = !boss || !boss.alive;
  const enemiesCleared = enemies.every(e => !e.alive);
  if (bossCleared && enemiesCleared && !waveTransition) {
    waveTransition = true;
    if (wave >= MAX_WAVES) { state = 'win'; return; }
    wave++;
    setTimeout(() => spawnWave(), 1200);
  }

  // Draw
  enemyBullets.forEach(b => drawBullet(b, true));
  bullets.forEach(b => drawBullet(b, false));
  enemies.forEach(e => { if (e.alive) drawEnemy(e); });
  if (boss && boss.alive) drawBoss(boss);
  powerups.forEach(p => drawPowerup(p));
  drawShip(ship.x, ship.y, shieldTimer>0);
  particles.forEach(p => {
    ctx.globalAlpha = p.life/35; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  });

  // Wave clear banner
  if (waveTransition && wave <= MAX_WAVES) {
    ctx.textAlign='center'; ctx.fillStyle='rgba(100,240,160,0.9)'; ctx.font='bold 20px monospace';
    ctx.fillText('WAVE ' + (wave-1) + ' CLEARED!', W/2, H/2);
    ctx.fillStyle='rgba(200,220,255,0.6)'; ctx.font='13px monospace';
    ctx.fillText('Incoming: Wave ' + wave, W/2, H/2+26);
  }

  drawHUD();
  raf = requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[key] = true;
  if (key === ' ') {
    e.preventDefault();
    if (!e.repeat) {
      if (state === 'retry') useRetry();
      else if (state==='idle'||state==='gameover'||state==='win') { state='play'; initGame(); }
    }
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(key)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[key] = false;
});

document.querySelectorAll('#touch-controls button').forEach(btn => {
  const key = btn.dataset.key;
  const press = e => {
    e.preventDefault();
    keys[key] = true;
    if (key === ' ') {
      if (state === 'retry') useRetry();
      else if (state==='idle'||state==='gameover'||state==='win') {
        state='play';
        initGame();
      }
    }
  };
  const release = e => {
    e.preventDefault();
    keys[key] = false;
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
});

initStars(); loop();
</script>
</body>
</html>

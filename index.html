<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Defender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #c8dcff;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #8aa0c0;
  }
  #hud strong { color: #e0eeff; }
  #gc {
    border: 1px solid #1a3050;
    border-radius: 8px;
    display: block;
    background: #050a14;
  }
  #msg {
    margin-top: 10px;
    font-size: 12px;
    color: #5a7090;
    text-align: center;
  }
</style>
</head>
<body>

<div id="hud">
  <span>Score: <strong id="score-display">0</strong></span>
  <span id="level-display">Wave 1</span>
  <span>Lives: <strong id="lives-display">3</strong></span>
</div>
<canvas id="gc" width="480" height="540"></canvas>
<div id="msg">Arrow keys / WASD to move &nbsp;|&nbsp; Space to shoot &nbsp;|&nbsp; Press Space to start</div>

<script>
const C = document.getElementById('gc');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;

let state = 'idle', score = 0, lives = 3, wave = 1;
let ship, bullets, enemies, particles, powerups, stars;
let keys = {}, frame = 0, raf;
let shootCooldown = 0, enemyShootCooldown = 0, enemyBullets = [];
let shieldTimer = 0, rapidTimer = 0, spreadActive = false;

function initStars() {
  stars = Array.from({ length: 80 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3,
    s: Math.random() * 0.5 + 0.2
  }));
}

function initGame() {
  score = 0; lives = 3; wave = 1; frame = 0;
  ship = { x: W / 2, y: H - 70, w: 28, h: 28, speed: 4 };
  bullets = []; enemies = []; particles = []; powerups = []; enemyBullets = [];
  shootCooldown = 0; shieldTimer = 0; rapidTimer = 0; spreadActive = false;
  spawnWave();
  initStars();
}

function spawnWave() {
  enemies = [];
  const cols = 6 + Math.min(wave - 1, 4);
  const rows = 2 + Math.floor(wave / 2);
  const speed = 0.5 + wave * 0.2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const type = r === 0 && wave > 2 ? 'elite' : r < 2 ? 'fast' : 'basic';
      enemies.push({
        x: 60 + c * Math.floor((W - 100) / cols),
        y: 50 + r * 48,
        w: 24, h: 18,
        alive: true, type,
        speed, dir: 1, dy: 0,
        hp: type === 'elite' ? 2 : 1
      });
    }
  }
}

function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 30, color
    });
  }
}

function trySpawnPowerup(x, y) {
  if (Math.random() < 0.18) {
    const types = ['shield', 'rapid', 'spread'];
    powerups.push({
      x, y, vy: 1.2,
      type: types[Math.floor(Math.random() * types.length)],
      life: 300
    });
  }
}

function drawStars() {
  stars.forEach(s => {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.fillStyle = `rgba(200,220,255,${0.3 + s.r * 0.2})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });
}

function drawShip(x, y, shield) {
  ctx.save(); ctx.translate(x, y);
  if (shield) {
    ctx.strokeStyle = 'rgba(80,200,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = '#4ab5f5';
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(12, 12); ctx.lineTo(0, 6); ctx.lineTo(-12, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a6fa8';
  ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-14, 16); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(14, 16); ctx.lineTo(8, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(80,200,255,0.8)';
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(5, 14); ctx.lineTo(-5, 14); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.type === 'elite' ? '#e06060' : e.type === 'fast' ? '#d4a030' : '#7c60d4';
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-12, -8); ctx.lineTo(0, -4); ctx.lineTo(12, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(0, -2, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBullet(b, enemy = false) {
  ctx.save();
  ctx.shadowBlur = 6;
  ctx.shadowColor = enemy ? '#ff6060' : '#60e0ff';
  ctx.fillStyle = enemy ? '#ff6060' : '#60e0ff';
  ctx.beginPath(); ctx.roundRect(b.x - 2, b.y - 6, 4, 12, 2); ctx.fill();
  ctx.restore();
}

function drawPowerup(p) {
  const colors = { shield: '#60cfff', rapid: '#ffd060', spread: '#a0f080' };
  const labels = { shield: 'S', rapid: 'R', spread: 'X' };
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = colors[p.type]; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(labels[p.type], 0, 0); ctx.restore();
}

function drawHUD() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('lives-display').textContent = lives;
  document.getElementById('level-display').textContent = 'Wave ' + wave;
  if (rapidTimer > 0 || shieldTimer > 0 || spreadActive) {
    ctx.font = '11px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,240,160,0.9)';
    let txt = '';
    if (shieldTimer > 0) txt += '[SHIELD] ';
    if (rapidTimer > 0) txt += '[RAPID] ';
    if (spreadActive) txt += '[SPREAD] ';
    ctx.fillText(txt, 8, H - 8);
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#050a14'; ctx.fillRect(0, 0, W, H);
  drawStars();

  if (state === 'idle' || state === 'gameover' || state === 'win') {
    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = 'rgba(74,181,245,0.9)'; ctx.font = 'bold 28px monospace';
      ctx.fillText('SPACE DEFENDER', W / 2, H / 2 - 40);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('Press SPACE to launch', W / 2, H / 2 + 10);
    } else if (state === 'gameover') {
      ctx.fillStyle = 'rgba(240,100,100,0.95)'; ctx.font = 'bold 26px monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('Score: ' + score, W / 2, H / 2);
      ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 28);
    } else {
      ctx.fillStyle = 'rgba(100,240,160,0.95)'; ctx.font = 'bold 26px monospace';
      ctx.fillText('YOU WIN!', W / 2, H / 2 - 40);
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '14px monospace';
      ctx.fillText('Score: ' + score, W / 2, H / 2);
      ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 28);
    }
    raf = requestAnimationFrame(loop);
    return;
  }

  frame++;

  // Move ship
  const spd = ship.speed;
  if ((keys['ArrowLeft'] || keys['a']) && ship.x > ship.w / 2 + 4) ship.x -= spd;
  if ((keys['ArrowRight'] || keys['d']) && ship.x < W - ship.w / 2 - 4) ship.x += spd;
  if ((keys['ArrowUp'] || keys['w']) && ship.y > H / 2) ship.y -= spd;
  if ((keys['ArrowDown'] || keys['s']) && ship.y < H - ship.h / 2 - 4) ship.y += spd;

  // Shoot
  if (shootCooldown > 0) shootCooldown--;
  const cooldown = rapidTimer > 0 ? 6 : 14;
  if (keys[' '] && shootCooldown === 0) {
    shootCooldown = cooldown;
    bullets.push({ x: ship.x, y: ship.y - 18, vy: -8 });
    if (spreadActive) {
      bullets.push({ x: ship.x, y: ship.y - 14, vy: -8, vx: -2 });
      bullets.push({ x: ship.x, y: ship.y - 14, vy: -8, vx: 2 });
    }
  }

  // Enemy movement
  let hitEdge = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.speed * e.dir * (e.type === 'fast' ? 1.5 : 1);
    if (e.x > W - 30 || e.x < 30) hitEdge = true;
  });
  if (hitEdge) enemies.forEach(e => { if (e.alive) { e.dir *= -1; e.y += 18; } });

  // Enemy shoot
  if (enemyShootCooldown > 0) enemyShootCooldown--;
  else {
    const alive = enemies.filter(e => e.alive);
    if (alive.length > 0) {
      const shooter = alive[Math.floor(Math.random() * alive.length)];
      enemyBullets.push({ x: shooter.x, y: shooter.y + 12, vy: 3 + wave * 0.3 });
      enemyShootCooldown = Math.max(20, 50 - wave * 5);
    }
  }

  // Move bullets
  bullets = bullets.filter(b => {
    b.x += b.vx || 0; b.y += b.vy;
    return b.y > -10 && b.x > -10 && b.x < W + 10;
  });
  enemyBullets = enemyBullets.filter(b => { b.y += b.vy; return b.y < H + 10; });

  // Bullet-enemy collision
  bullets.forEach((b, bi) => {
    enemies.forEach(e => {
      if (!e.alive) return;
      if (Math.abs(b.x - e.x) < 14 && Math.abs(b.y - e.y) < 12) {
        e.hp--;
        bullets.splice(bi, 1);
        if (e.hp <= 0) {
          e.alive = false;
          score += e.type === 'elite' ? 30 : e.type === 'fast' ? 20 : 10;
          spawnParticles(e.x, e.y, e.type === 'elite' ? '#ff8080' : e.type === 'fast' ? '#ffd080' : '#a080ff');
          trySpawnPowerup(e.x, e.y);
        }
      }
    });
  });

  // Enemy-ship & enemy bullet collision
  const hasShield = shieldTimer > 0;
  enemies.forEach(e => {
    if (!e.alive) return;
    if (Math.abs(e.x - ship.x) < 22 && Math.abs(e.y - ship.y) < 22) {
      if (!hasShield) { lives--; spawnParticles(ship.x, ship.y, '#4ab5f5', 12); }
      e.alive = false;
      shieldTimer = hasShield ? shieldTimer - 1 : 0;
      if (lives <= 0) { state = 'gameover'; return; }
    }
    if (e.y > H) { lives--; e.alive = false; if (lives <= 0) state = 'gameover'; }
  });

  enemyBullets = enemyBullets.filter(b => {
    if (Math.abs(b.x - ship.x) < 14 && Math.abs(b.y - ship.y) < 14) {
      if (!hasShield) { lives--; spawnParticles(ship.x, ship.y, '#ff8080', 8); }
      else shieldTimer = Math.max(0, shieldTimer - 30);
      if (lives <= 0) state = 'gameover';
      return false;
    }
    return true;
  });

  // Powerups
  powerups = powerups.filter(p => {
    p.y += p.vy; p.life--;
    if (Math.abs(p.x - ship.x) < 18 && Math.abs(p.y - ship.y) < 18) {
      if (p.type === 'shield') shieldTimer = 300;
      else if (p.type === 'rapid') rapidTimer = 300;
      else spreadActive = true;
      return false;
    }
    return p.life > 0 && p.y < H + 20;
  });
  if (rapidTimer > 0) rapidTimer--;
  if (spreadActive && rapidTimer === 0 && shieldTimer === 0) spreadActive = false;

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.95; p.vy *= 0.95;
    return p.life > 0;
  });

  // Next wave check
  if (enemies.every(e => !e.alive)) {
    wave++;
    if (wave > 6) { state = 'win'; return; }
    enemies = []; bullets = []; enemyBullets = [];
    setTimeout(() => { spawnWave(); }, 800);
  }

  // Draw everything
  enemyBullets.forEach(b => drawBullet(b, true));
  bullets.forEach(b => drawBullet(b, false));
  enemies.forEach(e => { if (e.alive) drawEnemy(e); });
  powerups.forEach(p => drawPowerup(p));
  drawShip(ship.x, ship.y, shieldTimer > 0);
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  drawHUD();
  raf = requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'idle' || state === 'gameover' || state === 'win') {
      state = 'play';
      initGame();
    }
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

initStars();
loop();
</script>
</body>
</html>
